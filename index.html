<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=dashboard1.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资管可视化大屏</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%; height:100%;
      background:#020617;
      color:#cceaff;
      font-family:"Microsoft YaHei","PingFang SC",sans-serif;
      display:flex; align-items:center; justify-content:center;
    }
    .entry {
      text-align:center;
      border:1px solid rgba(0,191,255,0.4);
      background:rgba(0,30,60,0.55);
      box-shadow:0 0 24px rgba(0,140,255,0.25), inset 0 0 18px rgba(0,140,255,0.1);
      padding:42px 56px;
    }
    .entry h1 { font-size:22px; letter-spacing:3px; margin-bottom:18px; color:#fff; }
    .entry p { font-size:14px; color:rgba(150,210,255,0.7); margin-bottom:24px; }
    .entry a {
      display:inline-block; margin:0 8px;
      padding:10px 24px;
      border:1px solid rgba(0,191,255,0.6);
      color:#00bfff; text-decoration:none; font-size:14px;
      box-shadow:0 0 10px rgba(0,170,255,0.3), inset 0 0 8px rgba(0,170,255,0.15);
      transition:.2s;
    }
    .entry a:hover { background:rgba(0,140,255,0.2); color:#fff; box-shadow:0 0 18px rgba(0,170,255,0.5); }
  </style>
</head>
<body>
  <div class="entry">
    <h1>资管可视化大屏</h1>
    <p>正在进入仪表盘一… 若未自动跳转，请手动选择：</p>
    <div>
      <a href="dashboard1.html">仪表盘一</a>
      <a href="dashboard2.html">仪表盘二</a>
    </div>
  </div>
</body>
</html>
