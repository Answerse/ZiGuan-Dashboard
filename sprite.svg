<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- 饼图 / 环形图（dashboard1 资产规划占比） -->
  <symbol id="pie" viewBox="0 0 150 150">
    <circle cx="75" cy="75" r="55" fill="none" stroke="rgba(0,100,200,0.12)" stroke-width="16"/>
    <circle class="seg" data-i="0" cx="75" cy="75" r="55" fill="none" stroke="#00bfff" stroke-width="16" stroke-dasharray="138.2 207.4" stroke-dashoffset="0" stroke-linecap="butt"/>
    <circle class="seg" data-i="1" cx="75" cy="75" r="55" fill="none" stroke="#4d9fff" stroke-width="16" stroke-dasharray="103.7 241.9" stroke-dashoffset="-138.2" stroke-linecap="butt"/>
    <circle class="seg" data-i="2" cx="75" cy="75" r="55" fill="none" stroke="#1e7fff" stroke-width="16" stroke-dasharray="69.1 276.5" stroke-dashoffset="-241.9" stroke-linecap="butt"/>
    <circle class="seg" data-i="3" cx="75" cy="75" r="55" fill="none" stroke="#0066ff" stroke-width="16" stroke-dasharray="34.6 311.0" stroke-dashoffset="-311.0" stroke-linecap="butt"/>
  </symbol>

  <!-- 账单收缴环形（dashboard1 / dashboard2 共用） -->
  <symbol id="bill" viewBox="0 0 150 150">
    <defs>
      <linearGradient id="gaugeGrad" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0%" stop-color="#0066ff"/><stop offset="100%" stop-color="#00e6ff"/>
      </linearGradient>
    </defs>
    <g stroke="rgba(0,180,255,0.35)" stroke-width="2">
      <line x1="21" y1="97" x2="28" y2="97" transform="rotate(0 75 97)"/>
      <line x1="21" y1="97" x2="28" y2="97" transform="rotate(30 75 97)"/>
      <line x1="21" y1="97" x2="28" y2="97" transform="rotate(60 75 97)"/>
      <line x1="21" y1="97" x2="28" y2="97" transform="rotate(90 75 97)"/>
      <line x1="21" y1="97" x2="28" y2="97" transform="rotate(120 75 97)"/>
      <line x1="21" y1="97" x2="28" y2="97" transform="rotate(150 75 97)"/>
      <line x1="21" y1="97" x2="28" y2="97" transform="rotate(180 75 97)"/>
    </g>
    <path class="bill-track" d="M 15 97 A 60 60 0 0 1 135 97" fill="none" stroke="rgba(0,120,220,0.28)" stroke-width="12" stroke-linecap="round"/>
    <path class="gauge-fill" d="M 15 97 A 60 60 0 0 1 135 97" fill="none" stroke="url(#gaugeGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="0.001 999"/>
    <circle cx="15" cy="97" r="3" fill="#00bfff"/>
    <circle cx="135" cy="97" r="3" fill="rgba(0,140,255,0.4)"/>
  </symbol>
</svg>
